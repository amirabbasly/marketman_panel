services:
  db:
    image: postgres:15-alpine
    container_name: marketman_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketmanpass}
      POSTGRES_DB: ${POSTGRES_DB:-marketman}
    volumes:
      - marketman_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketman} -d ${POSTGRES_DB:-marketman}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: marketman_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketman}:${POSTGRES_PASSWORD:-marketmanpass}@db:5432/${POSTGRES_DB:-marketman}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      PORT: 5000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@marketman.ir}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      TZ: Asia/Tehran
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: marketman_frontend
    depends_on:
      - backend
    environment:
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  marketman_db_data:
