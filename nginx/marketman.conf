# Marketman CRM — تنظیمات nginx
# این فایل را کپی کنید در: /etc/nginx/sites-available/marketman
# سپس: ln -s /etc/nginx/sites-available/marketman /etc/nginx/sites-enabled/marketman
#       nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name panel.marketmanai.ir www.panel.marketmanai.ir;

    root /var/www/marketman_panel;
    index index.html;

    # هدرهای امنیتی
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # فرانت‌اند Next.js — صفحات و استاتیک‌ها
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # بک‌اند Express API
    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # فایل‌های آپلودی (عکس کارت ملی و...)
    location /uploads {
        proxy_pass http://127.0.0.1:5000;
    }
}

